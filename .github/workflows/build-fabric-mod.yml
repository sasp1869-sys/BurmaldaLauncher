name: Build Burmalda Fabric Client
on:
  workflow_dispatch:
  push:
    branches: [main, add-burmalda-fabric-client]
    paths:
      - "BurmaldaClient/**"
      - ".github/workflows/build-fabric-mod.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build mod
        working-directory: BurmaldaClient
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BurmaldaClient-Fabric-1.21.1
          path: BurmaldaClient/build/libs/BurmaldaClient-*.jar
          if-no-files-found: error
